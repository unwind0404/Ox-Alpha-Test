#:schema node_modules/wrangler/config-schema.json
name = "wb-review-bot"
main = "src/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]
account_id = "c1a7f41d7163e5eea84fca90de69548c"

# Build
[build]
command = "npx esbuild src/index.ts --bundle --format=esm --platform=neutral --target=es2022 --outfile=dist/index.js"

# Vars (non-secret)
[vars]
DEPLOYMENT_MODE = "cloud"
DEFAULT_STRATEGY = "drafts"
ENVIRONMENT = "production"

# Placeholder for secrets — must be set via `wrangler secret put` or dashboard
# ADMIN_EMAILS = "..."  # Cloudflare Access emails
# MASTER_KEY = "..."     # AES-256-GCM key (32 random bytes, base64)
# FINGERPRINT_KEY = "..."  # HMAC key for token fingerprint
# WB_API_BASE = "https://feedbacks-api.wildberries.ru"

# D1
[[d1_databases]]
binding = "DB"
database_name = "wb-review-bot-db"
database_id = "b50928da-cfae-49c2-94c7-dd95661ccd7d"
migrations_dir = "migrations"



# Cron: 07:00 UTC daily sync
[triggers]
crons = ["0 7 * * *"]

# Limits
# [limits]
# cpu_ms = 30000  # Free plan не поддерживает CPU limit
